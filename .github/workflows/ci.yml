name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emissions
          POSTGRES_PASSWORD: emissions
          POSTGRES_DB: emissions_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emissions" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://emissions:emissions@localhost:5432/emissions_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Test (unit + PostgreSQL integration)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint --deny-warnings
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t climate-emissions-platform:ci .
      - name: Smoke test (migrations against a real database, then health check)
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=e -e POSTGRES_PASSWORD=e \
            -e POSTGRES_DB=e postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U e && break; sleep 1; done
          URL=postgresql+psycopg://e:e@db:5432/e
          docker run --rm --network ci -e EMISSIONS_DATABASE_URL=$URL \
            climate-emissions-platform:ci emissions migrate
          docker run -d --name api --network ci -p 8000:8000 -e EMISSIONS_DATABASE_URL=$URL \
            climate-emissions-platform:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/readyz && exit 0; sleep 1; done
          docker logs api; exit 1
